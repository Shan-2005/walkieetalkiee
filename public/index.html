<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Robofest 2.0 — Walkie Talkie</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0e0e0e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/assets/walkie-icon.png">
  <link rel="icon" type="image/png" href="/assets/walkie-icon.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- Material Symbols -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

  <link rel="stylesheet" href="/css/styles.css?v=6.0">
</head>
<body>

  <div id="app-root">

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <!-- ===== SCREEN 1: LOGIN ===== -->
    <section id="login-screen" class="view-screen active">
      <div class="login-page">

        <div class="login-header">
          <div class="login-logo" style="width:68px; height:68px; border-radius:var(--r-xl); background:none; border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; box-shadow:0 0 24px var(--red-glow); margin-bottom:4px; overflow:hidden;">
            <img src="/assets/walkie-icon.png" alt="Robofest Logo" style="width: 100%; height: 100%; object-fit: cover;">
          </div>
          <h1 class="login-title">ROBOFEST 2.0</h1>
          <p class="login-subtitle">Walkie-talkie network</p>
        </div>

        <div class="login-card">
          <form id="login-form">
            <div class="field-group">
              <label class="field-label">Your Name</label>
              <input type="text" id="user-name-input" class="field-input" placeholder="e.g. Aadarsh" required autocomplete="off">
            </div>

            <div class="field-group">
              <label class="field-label">Assigned Role</label>
              <select id="user-role-select" class="field-input">
                <option value="Drone SPOC">Drone SPOC</option>
                <option value="War SPOC">War SPOC</option>
                <option value="Soccer SPOC">Soccer SPOC</option>
                <option value="LFR SPOC">LFR SPOC</option>
                <option value="Obs Race SPOC">Obs Race SPOC</option>
                <option value="SUMO SPOC">SUMO SPOC</option>
                <option value="EXPO SPOC">EXPO SPOC</option>
                <option value="Boat SPOC">Boat SPOC</option>
                <option value="Core Committee">Core Committee</option>
                <option value="Volunteer">Team Volunteer</option>
              </select>
            </div>

            <button type="submit" class="connect-btn">
              <span class="material-symbols-rounded" style="font-size:20px;vertical-align:middle;margin-right:6px;">mic</span>
              Connect &amp; Allow Mic
            </button>
          </form>
        </div>

        <p class="login-footer">SRM Institute of Science &amp; Technology · Mechatronics · <span style="color:#E24B4A;">v6.0</span></p>

      </div>
    </section>

    <!-- ===== SCREEN 2: CHANNEL LIST ===== -->
    <section id="channel-list-screen" class="view-screen hidden">

      <!-- Top Navigation Bar -->
      <div class="nav-bar">
        <div class="nav-logo" style="width:34px; height:34px; border-radius:8px; border:1px solid var(--border); overflow:hidden; display:flex; align-items:center; justify-content:center; margin-left:8px;">
          <img src="/assets/walkie-icon.png" alt="Logo" style="width:100%; height:100%; object-fit:cover;">
        </div>
        <div class="nav-center">
          <span class="nav-title">ROBOFEST 2.0</span>
          <span class="nav-sub">Walkie-talkie network</span>
        </div>
        <button class="nav-icon-btn">
          <span class="material-symbols-rounded">notifications</span>
        </button>
      </div>

      <!-- User Profile Card -->
      <div class="user-profile-card">
        <div class="profile-left">
          <div class="profile-avatar" id="display-user-avatar">RF</div>
          <div class="profile-info">
            <span class="profile-name" id="display-user-name">User</span>
            <span class="profile-role" id="display-user-role">Role</span>
          </div>
        </div>
        <div class="online-badge">
          <span class="online-dot"></span>
          Online
        </div>
      </div>

      <!-- Section Label -->
      <div class="section-label">SELECT CHANNEL</div>

      <!-- Channel Grid (rendered by ui.js) -->
      <div id="channel-grid" class="channel-grid"></div>

    </section>

    <!-- ===== SCREEN 3: ACTIVE CHANNEL VIEW ===== -->
    <section id="channel-view-screen" class="view-screen hidden">
      <div class="channel-view-wrap">

        <!-- Top Nav -->
        <div class="nav-bar">
          <button class="nav-icon-btn" id="channel-back-btn">
            <span class="material-symbols-rounded">arrow_back</span>
          </button>
          <div class="nav-center">
            <span class="nav-title" id="active-channel-title">Channel</span>
            <span class="nav-sub" id="active-channel-location">Location</span>
          </div>
          <div class="member-count-chip">
            <span class="material-symbols-rounded" style="font-size:14px;">people</span>
            <span id="active-member-count">0</span>
          </div>
        </div>

        <div id="channel-theme-bar" class="channel-accent-bar"></div>

        <!-- Members Strip -->
        <div class="members-strip">
          <span class="members-label">MEMBERS</span>
          <div id="member-avatars" class="member-avatars-row"></div>
        </div>

        <!-- Center Display -->
        <div class="center-display">
          <div id="speaker-indicator" class="speaker-indicator hidden">
            <div class="speaker-avatar-ring">
              <span class="material-symbols-rounded" style="font-size:2rem;color:#E24B4A;">mic</span>
            </div>
            <p class="speaker-name" id="speaker-name">Someone</p>
            <p class="speaker-sub">is transmitting audio...</p>
          </div>

          <div id="audio-waveform" class="waveform hidden">
            <span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>

        <!-- PTT Bottom -->
        <div class="ptt-zone">
          <div class="ptt-status-line">
            <p id="ptt-status-text" class="ptt-status">Hold Volume Up or Press to Talk</p>
          </div>

          <div class="ptt-outer">
            <button id="ptt-button" class="ptt-btn">
              <span class="material-symbols-rounded ptt-icon">mic</span>
            </button>
            <div class="ptt-ring"></div>
          </div>

          <div class="toggle-row">
            <label class="toggle-switch">
              <input type="checkbox" id="toggle-mode-checkbox">
              <span class="toggle-track"><span class="toggle-thumb"></span></span>
            </label>
            <span class="toggle-label">Tap to Talk (Toggle)</span>
          </div>
        </div>

      </div>
    </section>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/channels.js?v=6.0"></script>
  <script src="/js/socket.js?v=6.0"></script>
  <script src="/js/audio.js?v=6.0"></script>
  <script src="/js/webrtc.js?v=6.0"></script>
  <script src="/js/ptt.js?v=6.0"></script>
  <script src="/js/ui.js?v=6.0"></script>
  <script src="/js/app.js?v=6.0"></script>

</body>
</html>
